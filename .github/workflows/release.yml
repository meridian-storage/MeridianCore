# SPDX-License-Identifier: Apache-2.0

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  conformance:
    uses: ./.github/workflows/conformance.yml
    permissions:
      contents: read

  release:
    needs: conformance
    name: Verify and release
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install package and release tools
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Verify tag and package versions
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}"
          assert Path("src/meridian_storage/_version.py").read_text().strip().endswith(f'"{version}"')
          PY
      - name: Run quality gates
        run: |
          ruff format --check src tests scripts
          ruff check src tests scripts
          mypy src/meridian_storage
          python scripts/verify_contracts.py
          pytest --cov=meridian_storage --cov-report=term-missing
      - name: Fix reproducible-build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build twice and verify
        run: |
          python -m build --no-isolation --outdir .artifacts/first
          python -m build --no-isolation --outdir .artifacts/second
          python scripts/compare_artifacts.py .artifacts/first .artifacts/second
          python scripts/verify_artifacts.py .artifacts/first/*
          mkdir release
          cp .artifacts/first/* release/
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python scripts/generate_sbom.py --output "release/meridian-storage-core-${PACKAGE_VERSION}.spdx.json" .artifacts/first/*
      - name: Attest release provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: release/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
      - name: Upload Python distributions for gated publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: |
            release/*.whl
            release/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: ${{ vars.PYPI_TRUSTED_PUBLISHING_ENABLED == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/meridian-storage-core/
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
