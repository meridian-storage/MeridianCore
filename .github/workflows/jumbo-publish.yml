# Member forwarder for jumbo publication (Jumbo Build & Versioning Standard,
# section 3.5 "Executors and the Publication Contract").
#
# This repository carries NO release logic of its own: every release step
# (lock, fingerprint, dedup, promote, publish on bump, index append) is owned
# by the reusable jumbo-publish workflow in zephytiju/JumboBuild. This file
# only calls it. Adopted from templates/member-jumbo-publish.yml in
# zephytiju/JumboBuild; <ref> is pinned to a full commit SHA, and the same
# SHA is passed as the jumbobuild-ref input: under workflow_call the
# reusable workflow cannot discover the ref its own file lives at
# (GITHUB_WORKFLOW_REF names the CALLER's workflow), so callers pin the
# jumbo build ref explicitly and the two pins always agree.
#
# Secrets flow in with `secrets: inherit` (JUNTAI_GITHUB_ARTIFACT_TOKEN and
# JUNTAI_INDEX_TOKEN; PYPI_TOKEN only when publishing to the public registry
# is enabled). Tokens are consumed via secrets and environment only — never
# as literals in any file.
name: jumbo publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  jumbo-publish:
    uses: zephytiju/JumboBuild/.github/workflows/jumbo-publish.yml@c30106c7385ee8005b41655a6fc92365d494cd05
    secrets: inherit
    with:
      # Same JumboBuild commit the uses: line pins: jumbo is built from
      # exactly the executor version this forwarder calls.
      jumbobuild-ref: c30106c7385ee8005b41655a6fc92365d494cd05
    # Reusable workflows cannot elevate permissions; the calling job must
    # grant everything the called workflow declares. The reusable workflow
    # (pinned c30106c7385ee8005b41655a6fc92365d494cd05) declares workflow-level
    # contents: write + packages: write, so this job grants both: contents: write
    # covers the GitHub Release and its tag, which live on THIS repository;
    # packages: write is required by the called workflow's declaration and is
    # only exercised with publish-image: true (this repository does not enable
    # image publication).
    permissions:
      contents: write
      packages: write
