# SPDX-License-Identifier: Apache-2.0
name: Final public release closure

on:
  workflow_call:

permissions:
  contents: read

jobs:
  public-closure:
    name: Public closure PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: "16"
            engine: "16-postgis-3.4"
            image: "postgis/postgis@sha256:681931a625df344215e9b8998bf34daf146b6a395ceacee4439eb9c85869239f"
          - pg: "17"
            engine: "17-postgis-3.5"
            image: "postgis/postgis@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f"
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify the public lock, every family contract, and actual packaged hosts
        env:
          MERIDIAN_POSTGRESQL_TEST_DSN: "host=127.0.0.1 port=5432 dbname=meridian user=meridian password=meridian"
          MERIDIAN_POSTGRESQL_ENGINE_VERSION: ${{ matrix.engine }}
          ENGINE_IMAGE: ${{ matrix.image }}
        run: bash tests/released_closure/run.sh "${RUNNER_TEMP}/closure"
      - name: Publish immutable closure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: released-closure-postgresql-${{ matrix.pg }}-${{ github.sha }}
          path: ${{ runner.temp }}/closure/evidence/
          if-no-files-found: error
          retention-days: 90
