name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Check formatting
        run: ruff format --check src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Check public contracts
        run: python scripts/verify_contracts.py
      - name: Type check
        run: mypy src/meridian_storage
      - name: Test
        run: pytest --cov=meridian_storage --cov-report=term-missing --cov-report=xml

  package:
    name: Reproducible package
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and build tools
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Fix reproducible-build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build twice
        run: |
          python -m build --no-isolation --outdir .artifacts/first
          python -m build --no-isolation --outdir .artifacts/second
      - name: Compare builds
        run: python scripts/compare_artifacts.py .artifacts/first .artifacts/second
      - name: Verify package contents
        run: python scripts/verify_artifacts.py .artifacts/first/*
      - name: Generate SPDX SBOM
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python scripts/generate_sbom.py --output ".artifacts/meridian-storage-core-${PACKAGE_VERSION}.spdx.json" .artifacts/first/*
      - name: Clean-install wheel smoke test
        run: |
          python -m venv .artifacts/venv
          WHEEL_PATH=$(find .artifacts/first -name '*.whl' -type f -print -quit)
          .artifacts/venv/bin/python -m pip install --disable-pip-version-check --no-deps "$WHEEL_PATH"
          cd /tmp
          "$GITHUB_WORKSPACE/.artifacts/venv/bin/python" -I -c 'from meridian_storage import Meridian; from meridian_storage.runtime import runtime_config_contract; from meridian_storage.spi import adapter_capability_contract; assert Meridian and runtime_config_contract()["$id"] and adapter_capability_contract()["$id"]'
      - name: Upload verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meridian-storage-core-${{ github.sha }}
          path: |
            .artifacts/first/*
            .artifacts/meridian-storage-core-*.spdx.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
