# SPDX-License-Identifier: Apache-2.0
name: Released adapter conformance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  postgresql:
    name: PostgreSQL ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [local, cluster]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build Core candidate wheel
        run: |
          python -m pip install --disable-pip-version-check build hatchling==1.27.0
          python -m build --no-isolation --wheel --outdir .candidate
      - name: Install published compatibility fixtures and candidate
        run: |
          mkdir -p conformance-evidence
          python -m venv .conformance-env
          .conformance-env/bin/python -m pip install --disable-pip-version-check -r tests/real_engine/requirements.txt --report conformance-evidence/dependency-install.json
          # Compatibility experiment: only Core is replaced. Downstream release
          # pins remain unchanged and must be repinned by their owning tasks.
          .conformance-env/bin/python -m pip install --no-deps --force-reinstall .candidate/*.whl --report conformance-evidence/candidate-install.json
          .conformance-env/bin/python -c 'import meridian_storage; assert "site-packages" in meridian_storage.__file__'
      - name: Run real engine and published descriptor conformance
        run: bash scripts/run-postgresql-conformance.sh '${{ matrix.profile }}' .conformance-env/bin/python -m pytest tests/real_engine -q --junitxml=conformance.xml
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-postgresql-${{ matrix.profile }}-${{ github.sha }}
          path: |
            conformance.xml
            conformance-evidence/
          if-no-files-found: error
