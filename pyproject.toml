# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "meridian-storage-core"
version = "1.0.0"
description = "Meridian V1 in-process runtime, binding resolver, and adapter SPI"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Meridian contributors" }]
keywords = ["storage", "adapter", "runtime", "meridian"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "hatchling==1.27.0",
  "jsonschema>=4.23,<5",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.urls]
Documentation = "https://github.com/zephytiju/MeridianCore#readme"
Issues = "https://github.com/zephytiju/MeridianCore/issues"
Repository = "https://github.com/zephytiju/MeridianCore"

[tool.hatch.build]
include = [
  "src/meridian_storage/**",
  "contracts/**",
  "docs/**",
  "examples/**",
  "compatibility.json",
  "LICENSE",
  "NOTICE",
  "README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_storage"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/runtime-config/meridian-config.v1.schema.json" = "meridian_storage/runtime/contracts/meridian-config.v1.schema.json"
"contracts/adapter-capability/meridian-adapter-capabilities.v1.schema.json" = "meridian_storage/spi/contracts/meridian-adapter-capabilities.v1.schema.json"
"contracts/public-api/meridian-core.v1.json" = "meridian_storage/contracts/meridian-core.v1.json"
"contracts/public-api/meridian-expression.v1.schema.json" = "meridian_storage/contracts/meridian-expression.v1.schema.json"
"contracts/public-api/meridian-operation.v1.schema.json" = "meridian_storage/contracts/meridian-operation.v1.schema.json"
"compatibility.json" = "meridian_storage/compatibility.json"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/contracts",
  "/docs",
  "/examples",
  "/tests",
  "/scripts",
  "/.github",
  "/compatibility.json",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/RELEASING.md",
  "/SECURITY.md",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "integration: runtime integration tests",
  "packaging: built-artifact and clean-install tests",
  "conformance: public adapter conformance-kit tests",
]

[tool.coverage.run]
branch = true
source = ["meridian_storage"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["meridian_storage"]
mypy_path = "src"
